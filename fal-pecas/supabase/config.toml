# Supabase local/CLI — project vinculado via `supabase link`.
# Não versionar secrets aqui.

[functions.create-mp-payment]
verify_jwt = true

[functions.create-asaas-payment]
verify_jwt = true

[functions.pay-asaas-credit-card]
verify_jwt = true

[functions.asaas-webhook]
verify_jwt = false

[functions.sync-mp-payment]
verify_jwt = true

[functions.sync-asaas-payment]
verify_jwt = true

# Webhook MP não envia JWT do Supabase — validamos x-signature internamente.
[functions.mercado-pago-webhook]
verify_jwt = false

# OTP: password_reset é público (anon); account_verify valida JWT dentro da function.
[functions.send-auth-otp]
verify_jwt = false

[functions.verify-auth-otp]
verify_jwt = false

[functions.melhorenvio-reverse]
verify_jwt = true

[auth]
# Produção Hostinger-only (cutover 2026-11-23). Localhost permanece para smoke local.
site_url = "https://falpecasautomotivas.com"
additional_redirect_urls = [
  "https://falpecasautomotivas.com",
  "https://falpecasautomotivas.com/**",
  "https://www.falpecasautomotivas.com",
  "https://www.falpecasautomotivas.com/**",
  "http://127.0.0.1:5173/**",
  "http://localhost:5173/**",
  "http://127.0.0.1:3000/**",
  "http://localhost:3000/**",
]

[auth.email]
max_frequency = "1m0s"
otp_length = 8

[auth.sms]
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.vector]
enabled = false
