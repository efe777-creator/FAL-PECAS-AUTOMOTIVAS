# LEGADO — Netlify NÃO é host canônico de produção (decisão 2026-11-23: Hostinger only).
# Mantido para rollback / preview histórico até cutover Hostinger estável.
# Canônico: docs/planejamento/FAL_DECISAO_INATIVAR_NETLIFY_HOSTINGER_ONLY_2026-11-23.md
# App Vite em fal-pecas/ — se o arquivo existir no branch, sobrescreve UI do site Netlify.

[build]
  base = "fal-pecas"
  command = "npm run build"
  # relativo ao base (fal-pecas/)
  publish = "dist"
  # Nunca pular build de produção (deploys recentes vieram "skipped")
  ignore = "exit 1"

# Arquivos SEO estáticos (não cair no SPA)
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = false

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = false

# SPA: demais rotas → index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[build.environment]
  NODE_VERSION = "22"
