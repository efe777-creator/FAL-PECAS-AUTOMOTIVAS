# Netlify — app Vite em fal-pecas/
# Site Settings → Build: este arquivo sobrescreve UI se existir no branch.

[build]
  base = "fal-pecas"
  command = "npm run build"
  # relativo ao base (fal-pecas/)
  publish = "dist"

# Arquivos SEO estáticos (não cair no SPA)
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = false

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = false

# SPA: demais rotas → index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[build.environment]
  NODE_VERSION = "22"
